<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Machine Builder</title>

    <!--This is what I mean by "the rest", see below-->
    <script src="creator.js" type="module" defer></script>

    <style>
        *{padding: 0;margin: 0;}

        .builder-site {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .sidebar, .editor {
            background-color: aliceblue;
        }
        
        .container {
            height: 100vh;
            border: solid black 2px;

            flex: 1;

            margin-left: auto;
            margin-right: auto;
        }

        .item {
            min-width: 200px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>

    <!--These are needed for the builder, the rest is for the creator page.-->
    <script src="../builder.mjs" type="module"></script>
    <link rel="stylesheet" href="../sbstyles.css">
</head>
<body>
    <div class="builder-site">
        <div class="sidebar">
            <div class="item">
                <h2>create</h2>
                <div class="opener" opens="create-list"><p>Click to expand</p></div>
                <div class="hidden" id="create-list">
                    <ul>
                        <li create="block">block</li>
                        <li create="block-button">block with a button</li>
                    </ul>
                </div>
            </div>

            <div class="item">
                <h2>elements</h2>
                <div class="opener" opens="elements-list"><p>Click to expand</p></div>
                <div class="hidden" id="elements-list">
                    <p>Drag to reorder</p>
                    <ul>
                    </ul>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="app-wrapper">
                <div id="app"></div>
            </div>
        </div>

        <div class="editor">
            <div class="item">
                <h2>export</h2>
                <button>get json</button>
            </div>
            <div class="item">
                <h2>modify</h2>
            </div>

            <div class="item">
                <h2>element editor</h2>
                <p>Select an element to edit</p>
            </div>

            <div class="item">
                <h2>page data</h2>

                <input type="text" id="pd-id"
                    autocapitalize="none"
                    autocomplete="none"
                    autocorrect="off"
                    autofocus="none"
                    placeholder="identifier"
                ><br>

                <input type="text" id="pd-val"
                    autocapitalize="none"
                    autocomplete="none"
                    autocorrect="off"
                    autofocus="none"
                    placeholder="value"
                ><br>

                <button id="create-data">Create</button>

                <hr>
                
                <ul id="data-list">
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
