<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Machine Builder</title>

    <!--This is what I mean by "the rest", see below-->
    <script src="creator.js" type="module" defer></script>

    <style>
        *{padding: 0;margin: 0;}

        .builder-site {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .sidebar, .editor {
            position: fixed;
            min-height: 100vh;
            background-color: aliceblue;
            width: 200px;
        }

        .sidebar {left: 0;}
        .editor {right: 0;}
        
        .container {
            width: calc(100vw - 450px);
            height: 100vh;
            border: solid black 2px;

            margin-left: auto;
            margin-right: auto;
        }
    </style>

    <!--These are needed for the builder, the rest is for the creator page.-->
    <script src="../builder.mjs" type="module"></script>
    <link rel="stylesheet" href="../sbstyles.css">
</head>
<body>
    <div class="builder-site">
        <div class="sidebar">
        </div>
        <div class="container">
            <div id="app"></div>
        </div>
        <div class="editor"></div>
    </div>
</body>
</html>
